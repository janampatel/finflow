name: CI

# Runs on every push and PR. Three cheap, high-signal gates:
#   1. lint   — ruff (style + common bugs)
#   2. smoke  — byte-compile + import the API package (catches broken imports
#               without needing the 6.3M-row dataset or GPU models)
#   3. docker — build the serving image (proves the Dockerfile is valid and the
#               runtime deps resolve, incl. CPU-only torch)
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.3.0
      # Non-blocking style report — keep the showcase green while surfacing nits.
      - run: ruff check src/ --output-format=github || true

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Byte-compile the source tree
        run: python -m compileall -q src/
      - name: Install runtime deps (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.2.1
          pip install -r requirements-api.txt
      - name: Import the API app (boots without data/models)
        env:
          GROQ_API_KEY: dummy-key-for-import-only
        run: python -c "import src.api.main; print('API import OK')"

  docker:
    runs-on: ubuntu-latest
    needs: [smoke]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build serving image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: finflow-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the container (/health)
        run: |
          docker run -d --name finflow -p 8080:8080 -e GROQ_API_KEY=dummy finflow-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health; then echo "\nhealthy"; exit 0; fi
            sleep 2
          done
          echo "health check failed"; docker logs finflow; exit 1
