[pytest]
# Pytest configuration for comprehensive testing and code coverage

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum Python version
minversion = 7.0

# Test paths
testpaths = tests

# Code coverage options
addopts =
    --cov=src
    --cov-report=html:coverage_report
    --cov-report=term-missing:skip-covered
    --cov-report=xml
    --cov-config=.coveragerc
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Markers for organizing tests
markers =
    unit: Unit tests for individual components
    integration: Integration tests combining multiple tools
    system: System and performance tests
    slow: Slow running tests
    scalability: Scalability and load tests
    performance: Performance and benchmark tests
    error_handling: Error handling and edge case tests

# Coverage configuration inline
[coverage:run]
branch = True
source = src
omit =
    */venv/*
    */site-packages/*
    */tests/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abc.abstractmethod
